<script>
  // تنبيه: القيم "masar_lang_v1" / "masar_theme_v1" وقائمة اللغات هنا يجب أن
  // تبقى مطابقة لـ LANG_KEY / THEME_KEY / SUPPORTED_LANGS في app.js.
  // هذا السكربت ينفَّذ مبكرًا (قبل app.js) فقط لتفادي وميض بصري عند التحميل.
  try {
    const savedLanguage = localStorage.getItem("masar_lang_v1");
    const supportedLanguages = ["en", "ar", "ary", "fr", "es", "pt", "it", "de"];
    const language = supportedLanguages.includes(savedLanguage) ? savedLanguage : "en";
    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
  } catch (error) {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";
  }
  try {
    const savedTheme = localStorage.getItem("masar_theme_v1");
    document.documentElement.setAttribute("data-theme", savedTheme === "dark" ? "dark" : "light");
  } catch (error) {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>

<header class="topbar">

  <div class="topbar-actions">

<div id="authModalOverlay" class="auth-overlay hidden">

    <div id="shelvesContainer" aria-live="polite"></div>
  </section>

  <!-- صفحة الكتاب (المسار) -->

    <div class="track-actions">
      <button class="btn-back" id="backToShelf"></button>
      <button class="btn-back btn-reset" id="resetProgress"></button>
    </div>

    <div id="trackNotFound" class="not-found hidden">
      <h1 id="notFoundTitle"></h1>
      <p id="notFoundDesc"></p>
      <button class="btn-primary" id="notFoundBrowseBtn"></button>
    </div>

    <div id="trackContent">

        <div class="track-spine" id="trackSpine"></div>
        <div class="track-info">

            <p class="track-author" id="trackAuthor"></p>
            <span class="track-level" id="trackLevel"></span>
            <span class="track-duration" id="trackDuration"></span>

          <h1 id="trackTitle"></h1>

          <div class="progress-track" id="trackProgressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="trackProgressFill"></div>
          </div>
          <p class="progress-text" id="trackProgressText"></p>

        </div>
      </div>
